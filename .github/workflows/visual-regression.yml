name: Visual Regression Testing

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [opened, synchronize, edited, reopened]
  push:
    branches: [ main, master ]

env:
  NODE_VERSION: '18'
  PERCY_PARALLEL_TOTAL: 2

jobs:
  parse-pr-template:
    name: Parse PR Template for Environment Selection
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.parse.outputs.environments }}
      test-scope: ${{ steps.parse.outputs.test-scope }}
      is-master: ${{ steps.parse.outputs.is-master }}
    steps:
      - name: Parse PR Description or Set Master Default
        id: parse
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          
          # Check if this is a master branch push
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master") ]]; then
            echo "Master branch detected - running full test suite"
            echo "environments=[\"onprem\", \"cloud\"]" >> $GITHUB_OUTPUT
            echo "test-scope=comprehensive" >> $GITHUB_OUTPUT
            echo "is-master=true" >> $GITHUB_OUTPUT
          else
            # Parse PR description for environment selection
            PR_BODY="${{ github.event.pull_request.body }}"
            
            # Initialize environments array with mandatory onprem
            ENVIRONMENTS='["onprem"'
            
            # Check if cloud is selected (look for checked cloud checkbox)
            if echo "$PR_BODY" | grep -q "\- \[x\] ☁️ \*\*Cloud\*\*"; then
              ENVIRONMENTS="$ENVIRONMENTS, \"cloud\""
            fi
            
            ENVIRONMENTS="$ENVIRONMENTS]"
            
            # Determine test scope
            TEST_SCOPE="essential"
            if echo "$PR_BODY" | grep -q "\- \[x\] 🎯 \*\*Comprehensive Testing\*\*"; then
              TEST_SCOPE="comprehensive"
            elif echo "$PR_BODY" | grep -q "\- \[x\] 🔍 \*\*Cross-Environment Comparison\*\*"; then
              TEST_SCOPE="comparison"
            fi
            
            echo "environments=$ENVIRONMENTS" >> $GITHUB_OUTPUT
            echo "test-scope=$TEST_SCOPE" >> $GITHUB_OUTPUT
            echo "is-master=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Final environments: $(cat $GITHUB_OUTPUT | grep environments)"
          echo "Test scope: $(cat $GITHUB_OUTPUT | grep test-scope)"

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: parse-pr-template
    strategy:
      matrix:
        environment: ${{ fromJson(needs.parse-pr-template.outputs.environments) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application for ${{ matrix.environment }}
        run: |
          if [[ "${{ matrix.environment }}" == "cloud" ]]; then
            npm run build:cloud
          else
            npm run build:onprem
          fi
          
      - name: Start application
        run: |
          if [[ "${{ matrix.environment }}" == "cloud" ]]; then
            npm run preview &
          else
            npm run preview &
          fi
          
          # Wait for application to be ready
          timeout=60
          while ! curl -s http://localhost:4173 > /dev/null && [ $timeout -gt 0 ]; do
            sleep 1
            timeout=$((timeout - 1))
          done
          
          if [ $timeout -eq 0 ]; then
            echo "Application failed to start"
            exit 1
          fi
          
      - name: Run Visual Tests - ${{ matrix.environment }}
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          VITE_ENVIRONMENT: ${{ matrix.environment }}
          PERCY_PARALLEL_NONCE: ${{ github.run_id }}-${{ matrix.environment }}
        run: |
          # Determine which tests to run based on scope
          TEST_SCOPE="${{ needs.parse-pr-template.outputs.test-scope }}"
          
          case $TEST_SCOPE in
            "essential")
              echo "Running essential visual tests for ${{ matrix.environment }}"
              if [[ "${{ matrix.environment }}" == "cloud" ]]; then
                npm run test:visual:cloud
              else
                npm run test:visual:onprem
              fi
              ;;
            "comprehensive")
              echo "Running comprehensive visual tests for ${{ matrix.environment }}"
              percy exec --config percy.${{ matrix.environment }}.yml -- cypress run --spec 'cypress/e2e/*.cy.ts' --env VITE_ENVIRONMENT=${{ matrix.environment }}
              ;;
            "comparison")
              echo "Running comparison visual tests for ${{ matrix.environment }}"
              percy exec --config percy.${{ matrix.environment }}.yml -- cypress run --spec 'cypress/e2e/essential-visual-tests.cy.ts,cypress/e2e/advanced-visual-tests.cy.ts' --env VITE_ENVIRONMENT=${{ matrix.environment }}
              ;;
          esac
          
      - name: Upload Cypress Screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.environment }}
          path: cypress/screenshots
          retention-days: 7
          
      - name: Upload Cypress Videos (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-${{ matrix.environment }}
          path: cypress/videos
          retention-days: 7

  test-results-summary:
    name: Visual Testing Summary
    runs-on: ubuntu-latest
    needs: [parse-pr-template, visual-tests]
    if: always()
    
    steps:
      - name: Generate Test Summary
        run: |
          echo "# 📊 Visual Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.head_ref || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environments Tested:** ${{ needs.parse-pr-template.outputs.environments }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Scope:** ${{ needs.parse-pr-template.outputs.test-scope }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.parse-pr-template.outputs.is-master }}" == "true" ]]; then
            echo "🏠 **Master Branch Build** - Full baseline testing executed" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔀 **Pull Request Build** - Environment-specific testing" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results by Environment" >> $GITHUB_STEP_SUMMARY
          
          # Add results for each environment
          ENVIRONMENTS=$(echo '${{ needs.parse-pr-template.outputs.environments }}' | jq -r '.[]')
          
          for env in $ENVIRONMENTS; do
            echo "### $env Environment" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.visual-tests.result }}" == "success" ]]; then
              echo "✅ Visual tests passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Visual tests failed" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📈 **View detailed results:** [Percy Dashboard](https://percy.io)" >> $GITHUB_STEP_SUMMARY
          
      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const environments = ${{ needs.parse-pr-template.outputs.environments }};
            const testScope = '${{ needs.parse-pr-template.outputs.test-scope }}';
            const success = '${{ needs.visual-tests.result }}' === 'success';
            
            const statusIcon = success ? '✅' : '❌';
            const statusText = success ? 'Passed' : 'Failed';
            
            const comment = `## ${statusIcon} Visual Regression Tests ${statusText}
            
            **Environments:** ${environments.join(', ')}  
            **Scope:** ${testScope}  
            **Branch:** \`${{ github.head_ref }}\`
            
            ${success ? 
              '🎉 All visual tests passed! No unexpected visual changes detected.' : 
              '⚠️ Visual differences detected. Please review the Percy dashboard.'
            }
            
            **🔍 Review Results:** [Percy Dashboard](https://percy.io)
            
            ---
            <sub>Automated visual testing powered by Percy</sub>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });