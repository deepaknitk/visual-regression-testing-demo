name: Visual Regression Testing - Multi Environment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Determine which environments to test
  check-environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.check.outputs.environments }}
    steps:
      - name: Determine environments to test
        id: check
        run: |
          # Always test onprem (mandatory)
          ENVIRONMENTS='["onprem"]'
          
          # For main branch pushes, always test both environments
          if [[ "${{ github.event_name }}" == "push" ]]; then
            ENVIRONMENTS='["onprem", "cloud"]'
            echo "Main branch - testing both environments"
          else
            # For PRs, check if cloud testing is requested
            PR_BODY="${{ github.event.pull_request.body }}"
            if echo "$PR_BODY" | grep -q "\- \[x\] ☁️ \*\*Cloud\*\*"; then
              ENVIRONMENTS='["onprem", "cloud"]'
              echo "Cloud testing requested in PR"
            else
              echo "Only onprem testing (cloud not requested in PR)"
            fi
          fi
          
          echo "environments=$ENVIRONMENTS" >> $GITHUB_OUTPUT
          echo "Testing environments: $ENVIRONMENTS"

  visual-tests:
    runs-on: ubuntu-latest
    name: Visual Tests - ${{ matrix.environment }}
    needs: check-environments
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.check-environments.outputs.environments) }}
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Configure npm for stability
        run: |
          npm config set fund false
          npm config set audit-level moderate

      - name: Clean and install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Verify Rollup installation
        run: |
          npm list rollup || npm install rollup --force

      - name: Build application for ${{ matrix.environment }}
        run: npm run build
        env:
          VITE_ENVIRONMENT: ${{ matrix.environment }}

      - name: Start application
        run: npm run preview &
        env:
          CI: true

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 60000

      - name: Run Cypress tests with Percy - ${{ matrix.environment }}
        run: npx percy exec --config percy.${{ matrix.environment }}.yml -- npx cypress run --spec 'cypress/e2e/essential-visual-tests.cy.ts' --env VITE_ENVIRONMENT=${{ matrix.environment }}
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_TARGET_BRANCH: main
          PERCY_COMMIT: ${{ github.sha }}
          PERCY_PULL_REQUEST: ${{ github.event.number }}
          PERCY_PARALLEL_NONCE: ${{ github.run_id }}
          PERCY_PARALLEL_TOTAL: 2
          VITE_ENVIRONMENT: ${{ matrix.environment }}
          CYPRESS_baseUrl: http://localhost:4173
